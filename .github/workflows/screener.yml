name: PulseAI Autonomous NSE Screener

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "autonomous_cycle"
        type: choice
        options:
          - autonomous_cycle
          - live_manage
          - morning_prep
          - premarket_update
          - eod

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute PulseAI Engine
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'autonomous_cycle' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py "${RUN_MODE}"

      - name: Commit & Sync Updated Portfolio State
        run: |
          git config user.name "PulseAI Bot"
          git config user.email "actions@github.com"
          git add portfolio_state.json trade_history.json model_weights.json morning_watchlist.json shadow_ledger.json sector_cache.json ml_feature_log.json ml_context_model.pkl || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(pulseai): update portfolio, ledger, shadow memory, ML model & weights [${{ github.event.inputs.mode || 'autonomous_cycle' }}]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No state changes to commit."
          fi