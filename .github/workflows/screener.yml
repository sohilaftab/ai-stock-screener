name: PulseAI Autonomous NSE Screener

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "autonomous_cycle"
        type: choice
        options:
          - autonomous_cycle
          - live_manage
          - morning_prep
          - premarket_update
          - eod
  schedule:
    - cron: "35 3 * * 1-5"
    - cron: "*/10 3-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: pulseai-state-writer
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute PulseAI Engine
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'autonomous_cycle' }}
          DEFER_TELEGRAM_UNTIL_PUSH: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py "${RUN_MODE}"

      - name: Commit & Push Updated Portfolio State
        run: |
          git config user.name "PulseAI Bot"
          git config user.email "actions@github.com"

          STATE_FILES=(
            portfolio_state.json
            trade_history.json
            model_weights.json
            morning_watchlist.json
            shadow_ledger.json
            sector_cache.json
            ml_feature_log.json
            ml_context_model.pkl
            ai_research_log.json
            sent_alerts_log.json
          )

          for f in "${STATE_FILES[@]}"; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "chore(pulseai): update portfolio, ledger, research audit & weights [${{ github.event.inputs.mode || 'autonomous_cycle' }}] [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No state changes to commit."
          fi

      - name: Flush Verified Telegram Alerts (Post-Push Only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python audit_tracker.py --flush-alerts
          if [ -f "sent_alerts_log.json" ]; then
            git add sent_alerts_log.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(pulseai): log verified post-push Telegram alerts [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi
          fi